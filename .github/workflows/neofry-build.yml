name: neofry-build

# Mirrors the build workflow used by the in-house brainstorm repos
# (brainstorm_server, Brainstorm-UI, brainstorm_graperank_algorithm) so
# that operators can pin a specific commit via the standard `sha-<short>`
# tag in Helm values.
#
# Differences vs. those repos, all intentional:
#   * `submodules: true` on checkout — strfry has git submodules.
#   * Uses Dockerfile.neofry (the relay+plugin variant) rather than the
#     plain Dockerfile.
#   * Release model is BRANCH-DRIVEN: pushing the `neofry` branch publishes
#     `:latest` + `:latest-<strfry-ver>`, multi-arch. There is no version-tag
#     trigger — deploys pin the immutable `:sha-<short>` tag in Helm values.
on:
  workflow_dispatch:
  push:
    # Every branch builds a test image (`:<branch>` + `:sha-<short>`, amd64).
    # Release tags + arm64 are gated to the `neofry` branch below.
    branches:
      - "**"

concurrency:
  group: neofry-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Override the default `<org>/<repo>` -> `nosfabrica/strfry` mapping;
  # the published image has historically been called `neofry` and the
  # Helm chart's neofry.image.repository default points there.
  IMAGE_NAME: ${{ github.repository_owner }}/neofry

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile.neofry
          ignore: DL3008,DL3018,DL3059
          failure-threshold: warning

      - name: Compute lowercase image name
        id: img
        run: |
          echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The upstream strfry base version (highest X.Y.Z git tag), for the
      # `:latest-<ver>` release tag. The image repo is `.../neofry`, so this
      # already reads as "neofry built on strfry <ver>".
      - name: Compute strfry base version
        id: ver
        run: |
          STRFRY_VER=$(git tag --sort=-v:refname | grep -P '^\d+\.\d+\.\d+$' | head -1)
          echo "strfry=${STRFRY_VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.img.outputs.name }}
          # Tag matrix:
          #   * `:<branch>`             every branch push        (mutable, test image)
          #   * `:sha-<short>`          every push               (immutable)  <- pin this in values
          #   * `:latest-<strfry-ver>`  neofry branch only       (mutable, floating latest per base)
          #   * `:latest`               neofry branch only       (mutable, the release)
          # The two `:latest*` tags are release identifiers, gated to the `neofry`
          # branch so a feature branch can never clobber them.
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest-${{ steps.ver.outputs.strfry }},enable=${{ github.ref == format('refs/heads/{0}', 'neofry') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'neofry') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.neofry
          push: true
          provenance: false
          # neofry branch (release) = both arches; every other branch = amd64 only (fast)
          platforms: ${{ github.ref == format('refs/heads/{0}', 'neofry') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
