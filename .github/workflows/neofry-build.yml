name: neofry-build

# Mirrors the build workflow used by the in-house brainstorm repos
# (brainstorm_server, Brainstorm-UI, brainstorm_graperank_algorithm).
#
# Differences vs. those repos, all intentional:
#   * `submodules: true` on checkout — strfry has git submodules.
#   * Uses Dockerfile.neofry (the relay+plugin variant) rather than the
#     plain Dockerfile.
#   * Release model is BRANCH-DRIVEN: pushing the `neofry` branch publishes
#     `:latest` + `:latest-<strfry-ver>`, multi-arch. There is no version-tag
#     trigger.
#   * Each arch is built on its own native runner and pushed by digest, then a
#     `merge` job assembles the manifest list — so no tag exists until both
#     arches are up. arm64 under QEMU took 41-47min per release vs ~5min native.
on:
  workflow_dispatch:
  push:
    # Every branch builds both arches (`:<branch>` + `:sha-<short>`).
    # The `:latest*` release tags are gated to the `neofry` branch below.
    branches:
      - "**"

concurrency:
  group: neofry-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/nosfabrica/neofry

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile.neofry
          ignore: DL3008,DL3018,DL3059
          failure-threshold: warning

      # Labels only — tagging happens once, in the merge job.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, untagged: nothing is referenceable in the registry
      # until the merge job tags the manifest list.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.neofry
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch scope; a shared one has the two jobs evicting each other.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Artifacts are the only cross-job channel, so the digest travels as a
      # filename.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests and tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      # fetch-depth: 0 — the strfry base version below reads git tags.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # The upstream strfry base version (highest X.Y.Z git tag), for the
      # `:latest-<ver>` release tag. The image repo is `.../neofry`, so this
      # already reads as "neofry built on strfry <ver>".
      - name: Compute strfry base version
        id: ver
        run: |
          STRFRY_VER=$(git tag --sort=-v:refname | grep -P '^\d+\.\d+\.\d+$' | head -1)
          echo "strfry=${STRFRY_VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Manifest-list annotations, for `imagetools create --annotation`.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.IMAGE }}
          # Tag matrix:
          #   * `:<branch>`             every branch push        (mutable, test image)
          #   * `:sha-<short>`          every push               (immutable)
          #   * `:latest-<strfry-ver>`  neofry branch only       (mutable, floating latest per base)
          #   * `:latest`               neofry branch only       (mutable, the release)
          # The two `:latest*` tags are release identifiers, gated to the `neofry`
          # branch so a feature branch can never clobber them.
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=raw,value=latest-${{ steps.ver.outputs.strfry }},enable=${{ github.ref == format('refs/heads/{0}', 'neofry') }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'neofry') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r ann; do args+=(--annotation "$ann"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
