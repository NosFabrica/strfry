name: neofry-build

on:
  push:
    branches:
      - "neofry"
    tags:
      - "neofry-*"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Determine tags
        id: tags
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/neofry"

          # Extract strfry base version from nearest non-neofry tag
          STRFRY_VER=$(git tag --sort=-v:refname | grep -P '^\d+\.\d+\.\d+$' | head -1)
          STRFRY_VER="${STRFRY_VER:-unknown}"

          # Neofry version from latest neofry-* tag
          NEOFRY_VER=$(git tag --sort=-v:refname | grep -oP '^neofry-\K.*' | head -1)
          NEOFRY_VER="${NEOFRY_VER:-0.0.0}"

          FULL_VER="neofry-${NEOFRY_VER}-strfry-${STRFRY_VER}"

          TAGS="${IMAGE}:latest"
          TAGS="${TAGS},${IMAGE}:${FULL_VER}"

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Image tags: ${FULL_VER}, latest"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.neofry
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
